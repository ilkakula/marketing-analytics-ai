server {
  listen 80;
  root /usr/share/nginx/html;

  # CSV uploads up to 5 MB (the server limit) + multipart headers.
  client_max_body_size 6m;

  # Same origin for the frontend and the API: no CORS, and the token never goes to another domain.
  location /api/ {
    proxy_pass http://server:4750;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;   # an AI analysis can take up to ~35 s (+ headroom)
  }

  # Static files with a hash in their name: long caching; never cache index.html.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;   # SPA: React Router resolves the routes
  }
}
