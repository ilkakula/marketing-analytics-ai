name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendlens
          POSTGRES_PASSWORD: spendlens
          POSTGRES_DB: spendlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spendlens -d spendlens_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://spendlens:spendlens@localhost:5432/spendlens_test
      TEST_DATABASE_URL: postgres://spendlens:spendlens@localhost:5432/spendlens_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npm run typecheck -w server
          npm run typecheck -w client
      - name: Build
        run: |
          npm run build -w server
          npm run build -w client
      - name: "Tests (migrations run automatically against the test database)"
        run: npm test
      - name: "AI evaluation (offline, rule accuracy and validator corpus)"
        run: npm run eval -w server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f server/Dockerfile -t spendlens-server .
      - name: Build the client image
        run: docker build -f client/Dockerfile -t spendlens-client .
